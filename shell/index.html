<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>webrig shell</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e28;--border:#2a2f3d;--accent:#5865f2;--text:#e8eaf0;--text2:#9099b0;--green:#3ba55c;--red:#ed4245;--yellow:#faa61a;--font-mono:'Cascadia Code','Fira Code',monospace}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
header h1{font-size:14px;font-weight:700;letter-spacing:.04em;margin-right:4px}
.status-dot{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.status-connected{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green)}
.status-connecting{background:color-mix(in srgb,var(--yellow) 20%,transparent);color:var(--yellow)}
.status-disconnected{background:color-mix(in srgb,var(--border) 50%,transparent);color:var(--text2)}
.lbl{font-size:10px;color:var(--text2)}.spacer{flex:1}
.tabs{display:flex;gap:2px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.tab-btn{padding:8px 14px;font-size:12px;font-weight:500;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);cursor:pointer}
.tab-btn:hover{color:var(--text)}.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-panel{display:none;flex:1;overflow:hidden}.tab-panel.active{display:flex;flex-direction:column}
#output,#terminal-output{flex:1;overflow-y:auto;padding:12px 16px;font-family:var(--font-mono);font-size:13px;line-height:1.6}
#terminal-output{background:var(--bg);color:#a8ff78}
.line{white-space:pre-wrap;word-break:break-word;padding:1px 0}
.line-user{color:var(--accent)}.line-assistant{color:var(--text)}.line-err{color:var(--red)}
.line-info{color:var(--text2)}.line-tool{color:var(--yellow)}.line-raw{color:var(--text2);font-size:11px}
.input-bar{display:flex;gap:8px;padding:10px 16px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0}
select,input[type=text]{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:13px;outline:none}
select:focus,input[type=text]:focus{border-color:var(--accent)}
#prompt-input{flex:1}
button{background:var(--accent);border:none;color:#fff;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:500}
button:hover{opacity:.9}.btn-ghost{background:var(--bg3);color:var(--text2)}
.browser-bar{display:flex;gap:8px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.browser-bar input{flex:1}
#browser-frame{flex:1;border:none;background:#fff}
#settings-content{padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;color:var(--text2)}
.field input{width:100%;max-width:420px}
.cli-note{font-size:12px;color:var(--text2);padding:10px;background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:6px;border:1px solid color-mix(in srgb,var(--accent) 20%,transparent)}
</style>
</head>
<body>
<header>
  <h1>webrig</h1>
  <span id="companion-status" class="status-dot status-disconnected">disconnected</span><span class="lbl">companion</span>
  <span id="wc-status" class="status-dot status-disconnected">unavailable</span><span class="lbl">webcontainer</span>
  <span id="ext-status" class="status-dot status-disconnected">no ext</span><span class="lbl">extension</span>
  <span class="spacer"></span>
</header>
<div class="tabs">
  <button class="tab-btn active" data-tab="shell-panel">Shell</button>
  <button class="tab-btn" data-tab="terminal-panel">Terminal</button>
  <button class="tab-btn" data-tab="browser-panel">Browser</button>
  <button class="tab-btn" data-tab="settings-panel">Settings</button>
</div>
<div id="shell-panel" class="tab-panel active" style="flex-direction:column">
  <div id="output"></div>
  <div class="input-bar">
    <select id="agent-select">
      <optgroup label="API (in-browser)">
        <option value="gemini">Gemini 2.0 Flash</option>
        <option value="anthropic">Claude (Anthropic)</option>
      </optgroup>
      <optgroup label="WebContainer (in-browser)">
        <option value="claude">claude CLI</option>
        <option value="kilo">Kilo Code</option>
        <option value="opencode">OpenCode</option>
      </optgroup>
    </select>
    <input id="prompt-input" type="text" placeholder="Enter prompt…" autocomplete="off">
    <button id="send-btn">Send</button>
    <button id="clear-btn" class="btn-ghost">Clear</button>
  </div>
</div>
<div id="terminal-panel" class="tab-panel"><div id="terminal-output"></div></div>
<div id="browser-panel" class="tab-panel">
  <div class="browser-bar">
    <input id="browser-url" type="text" placeholder="https://…">
    <button id="browser-go">Go</button>
    <button id="browser-snap" class="btn-ghost">Snapshot</button>
  </div>
  <iframe id="browser-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</div>
<div id="settings-panel" class="tab-panel">
  <div id="settings-content">
    <p class="cli-note">API agents (Gemini, Claude) run in-browser. WebContainer agents (kilo, opencode, claude CLI) run via WASM in Chrome/Edge — or companion fallback (<code>npx webrig</code>).</p>
    <div class="field"><label>Gemini API Key</label><input id="key-gemini" type="text" placeholder="AIza…"></div>
    <div class="field"><label>Anthropic API Key</label><input id="key-anthropic" type="text" placeholder="sk-ant-…"></div>
    <div class="field"><label>OpenAI API Key</label><input id="key-openai" type="text" placeholder="sk-…"></div>
    <div class="field"><label>OpenRouter API Key</label><input id="key-openrouter" type="text" placeholder="sk-or-…"></div>
    <button id="save-keys" style="width:fit-content">Save Keys</button>
  </div>
</div>
<script type="module" src="shell.js"></script>
</body>
</html>
